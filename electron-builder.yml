appId: com.gogigi.app
productName: GoGiGi
copyright: Copyright © 2026 GoGiGi

directories:
  output: release
  buildResources: build

files:
  - src/**/*
  - package.json

# Where auto-updates are published to and read from.
# owner/repo are filled in automatically from package.json "repository"
# when building in GitHub Actions; set them explicitly if you build locally.
publish:
  provider: github
  owner: shadow-artlap
  repo: GoGiGi
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# Generates latest.yml alongside the installer so electron-updater can
# detect new versions from GitHub Releases.
