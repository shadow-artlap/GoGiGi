name: Release

# Build and publish a GoGiGi release whenever you push a version tag, e.g. v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (electron-builder → GitHub Releases)
        env:
          # Provided automatically by Actions; lets electron-builder upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional): add these repo secrets to sign the installer.
          # CSC_LINK = base64 of your .pfx certificate; CSC_KEY_PASSWORD = its password.
          # electron-builder signs when present and skips silently when empty.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish always
