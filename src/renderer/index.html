<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoGiGi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.png" alt="GoGiGi" />
    <div class="brand">Go<span>GiGi</span></div>
    <div class="ver">v<span id="version">…</span></div>
  </header>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="updates">Updates</button>
  </nav>

  <main>
    <!-- Dashboard -->
    <section class="view active" id="view-dashboard">
      <div class="toolbar">
        <button class="btn" id="btnRefresh">รีเฟรช</button>
        <span class="muted" id="refreshedAt"></span>
      </div>
      <h2 class="section">ข้อมูลระบบ</h2>
      <div class="grid" id="sysGrid"></div>

      <h2 class="section" style="margin-top:22px;">หน่วยความจำ</h2>
      <div class="card">
        <div class="k">RAM ที่ใช้ <span id="memText"></span></div>
        <div class="bar"><i id="memBar"></i></div>
      </div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings">
      <h2 class="section">การตั้งค่า</h2>

      <div class="row">
        <div>
          <div class="label">ธีม</div>
          <div class="desc">เลือกโหมดสีของแอป (จำค่าหลังปิดโปรแกรม)</div>
        </div>
        <div class="grow"></div>
        <div class="seg" id="themeSeg">
          <button data-theme-mode="system">ตามระบบ</button>
          <button data-theme-mode="light">สว่าง</button>
          <button data-theme-mode="dark">มืด</button>
        </div>
      </div>

      <div class="row">
        <div>
          <div class="label">ชื่อที่แสดง</div>
          <div class="desc">บันทึกลงเครื่องอัตโนมัติเมื่อพิมพ์เสร็จ</div>
        </div>
        <div class="grow"></div>
        <input type="text" id="displayName" placeholder="เช่น Shadow" />
      </div>

      <div class="row">
        <div>
          <div class="label">ไฟล์ของแอป</div>
          <div class="desc">เปิดโฟลเดอร์ข้อมูล/บันทึก log บนเครื่อง</div>
        </div>
        <div class="grow"></div>
        <button class="btn" id="btnOpenData">โฟลเดอร์ข้อมูล</button>
        <button class="btn" id="btnOpenLogs">โฟลเดอร์ Log</button>
      </div>
    </section>

    <!-- Updates -->
    <section class="view" id="view-updates">
      <h2 class="section">อัปเดต</h2>
      <div class="update-box">
        <div class="card">
          <div class="k">เวอร์ชันปัจจุบัน</div>
          <div class="v">v<span id="curVer">…</span></div>
          <div class="status" id="status">พร้อมใช้งาน</div>
          <div class="bar" id="upBar" style="display:none;"><i id="upBarFill"></i></div>
          <div class="update-actions" style="margin-top:14px;">
            <button class="btn primary" id="btnCheck">ตรวจหาอัปเดต</button>
            <button class="btn" id="btnDownload" disabled>ดาวน์โหลด</button>
            <button class="btn" id="btnInstall" disabled>ติดตั้ง &amp; รีสตาร์ท</button>
          </div>
        </div>
        <p class="muted" style="margin-top:14px;">
          อัปเดตผ่าน GitHub Releases · <a href="#" id="repoLink">เปิดหน้า releases</a>
        </p>
      </div>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
